      <path d="M 148 552 A 108 44 0 0 0 364 552"></path>
    </g>
    <path d="M 148 372 V 652 A 108 44 0 0 0 364 652 V 372" fill="none" stroke="#7fd0f5" stroke-width="9"></path>
  </g>

  <!-- transform: the arrow between them -->
  <path d="M 404 512 H 596" stroke="url(#etc)" stroke-width="26" stroke-linecap="round"></path>
  <path d="M 556 466 L 610 512 L 556 558" fill="none" stroke="url(#etc)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="500" cy="512" r="46" fill="#0d2233"></circle>
  <circle cx="500" cy="512" r="46" fill="none" stroke="url(#etc)" stroke-width="16"></circle>

  <!-- destination: warehouse cube -->
  <g>
    <path d="M 764 296 L 916 384 L 916 560 L 764 648 L 612 560 L 612 384 Z" fill="#ffd166" opacity="0.16"></path>
    <path d="M 764 296 L 916 384 L 916 560 L 764 648 L 612 560 L 612 384 Z" fill="none" stroke="#ffd166" stroke-width="14" stroke-linejoin="round"></path>
    <path d="M 764 296 L 764 472 M 764 472 L 916 384 M 764 472 L 612 384" fill="none" stroke="#ffd166" stroke-width="12" stroke-linejoin="round" opacity="0.75"></path>
  </g>

  <!-- incremental: partial fill bars -->
  <g fill="#7fd0f5">
    <rect x="612" y="720" width="304" height="26" rx="13" opacity="0.22"></rect>
    <rect x="612" y="720" width="196" height="26" rx="13" opacity="0.85"></rect>
