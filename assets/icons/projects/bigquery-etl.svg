<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="etb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"></stop>
      <stop offset="1" stop-color="#08151f"></stop>
    </linearGradient>
    <linearGradient id="etc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"></stop>
      <stop offset="1" stop-color="#f08a3c"></stop>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#etb)"></rect>

  <!-- source: mysql cylinder -->
  <g>
    <path d="M 148 372 V 652 A 108 44 0 0 0 364 652 V 372 Z" fill="#4fb3e8" opacity="0.28"></path>
    <ellipse cx="256" cy="372" rx="108" ry="44" fill="#4fb3e8" opacity="0.9"></ellipse>
