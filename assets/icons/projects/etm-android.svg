<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="eab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2a63"></stop>
      <stop offset="1" stop-color="#160f26"></stop>
    </linearGradient>
    <linearGradient id="eas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a6ff"></stop>
      <stop offset="1" stop-color="#7b52d1"></stop>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#eab)"></rect>

  <!-- device outline -->
  <rect x="358" y="238" width="308" height="548" rx="46" fill="none" stroke="#b79cf0" stroke-width="16" opacity="0.32"></rect>

  <!-- sync loop: queued locally, drained to the server -->
  <g fill="none" stroke="url(#eas)" stroke-width="34" stroke-linecap="round">
    <path d="M 300 512 A 212 212 0 0 1 724 512" stroke-dasharray="520 400"></path>
    <path d="M 724 512 A 212 212 0 0 1 300 512" stroke-dasharray="520 400"></path>
  </g>
  <path d="M 300 512 L 258 452 M 300 512 L 358 470" fill="none" stroke="#c9a6ff" stroke-width="30" stroke-linecap="round"></path>
  <path d="M 724 512 L 766 572 M 724 512 L 666 554" fill="none" stroke="#7b52d1" stroke-width="30" stroke-linecap="round"></path>

  <!-- the row being written, instantly, offline -->
  <g>
    <path d="M 456 512 L 496 552 L 572 470" fill="none" stroke="#f3ecff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
</svg>
