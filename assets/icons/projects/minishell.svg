    <rect x="232" y="606" width="184" height="34" rx="17" fill="#bff5dc" opacity="0.6"></rect>
    <rect x="452" y="596" width="10" height="54" rx="5" fill="#5de3a6" opacity="0.95"></rect>
    <rect x="498" y="606" width="150" height="34" rx="17" fill="#bff5dc" opacity="0.42"></rect>
  </g>
  <g>
    <rect x="232" y="700" width="120" height="34" rx="17" fill="#bff5dc" opacity="0.3"></rect>
    <path d="M 392 717 H 470" stroke="#5de3a6" stroke-width="18" stroke-linecap="round" opacity="0.8"></path>
    <path d="M 448 693 L 476 717 L 448 741" fill="none" stroke="#5de3a6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"></path>
    <rect x="512" y="700" width="136" height="34" rx="17" fill="#bff5dc" opacity="0.22"></rect>
  </g>
