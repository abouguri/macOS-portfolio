<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="msb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2b24"></stop>
      <stop offset="1" stop-color="#070c0a"></stop>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#msb)"></rect>

  <!-- terminal frame -->
  <rect x="140" y="196" width="744" height="632" rx="40" fill="#0c1512" stroke="#5de3a6" stroke-opacity="0.22" stroke-width="6"></rect>
