  <g fill="#5de3a6" opacity="0.35">
    <circle cx="208" cy="248" r="17"></circle>
    <circle cx="268" cy="248" r="17"></circle>
    <circle cx="328" cy="248" r="17"></circle>
  </g>

  <!-- prompt + cursor -->
