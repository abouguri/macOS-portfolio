<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tfb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a4d"></stop>
      <stop offset="1" stop-color="#07171f"></stop>
    </linearGradient>
    <linearGradient id="tfc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe3c4"></stop>
      <stop offset="1" stop-color="#22b3a0"></stop>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tfb)"></rect>

  <!-- list rows, each one line -->
  <g>
    <circle cx="268" cy="336" r="46" fill="none" stroke="url(#tfc)" stroke-width="20"></circle>
    <path d="M 244 336 L 264 356 L 296 316" fill="none" stroke="url(#tfc)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"></path>
    <rect x="360" y="318" width="392" height="34" rx="17" fill="#dff5ef" opacity="0.5"></rect>
  </g>
  <g>
    <circle cx="268" cy="512" r="46" fill="none" stroke="#8fb6c4" stroke-width="20" opacity="0.55"></circle>
    <rect x="360" y="494" width="330" height="34" rx="17" fill="#dff5ef" opacity="0.92"></rect>
  </g>
  <g>
    <circle cx="268" cy="688" r="46" fill="none" stroke="#8fb6c4" stroke-width="20" opacity="0.55"></circle>
    <rect x="360" y="670" width="252" height="34" rx="17" fill="#dff5ef" opacity="0.7"></rect>
  </g>

  <!-- hairline under the section, not a card -->
  <rect x="176" y="228" width="672" height="5" rx="2.5" fill="#6fe3c4" opacity="0.35"></rect>
  <rect x="176" y="792" width="672" height="5" rx="2.5" fill="#6fe3c4" opacity="0.18"></rect>
</svg>
